  .modulex-acilis-urun-nokta-lzemin { position: absolute; inset: 2%; border-radius: 62% 38% 46% 54% / 48% 40% 60% 52%; background-color: color-mix(in srgb, --accent-- 16%, --bg--); animation: modulex-acilis-urun-nokta-leke 14s ease-in-out infinite alternate; }

  .modulex-acilis-urun-nokta-ufoto { position: absolute; inset: 9%; inline-size: 82%; block-size: 82%; object-fit: cover; border-radius: 46% 54% 50% 50% / 50% 46% 54% 50%; box-shadow: 0 40px 70px -40px color-mix(in srgb, --text-- 80%, transparent); }

  @keyframes modulex-acilis-urun-nokta-halka { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, --accent-- 55%, transparent); } 100% { box-shadow: 0 0 0 16px transparent; } }
  .modulex-acilis-urun-nokta-nokta:hover, .modulex-acilis-urun-nokta-nokta[aria-expanded="true"] { transform: scale(1.15); background-color: --text--; color: --bg--; }
  .modulex-acilis-urun-nokta-nokta:focus-visible { outline: 3px solid --text--; outline-offset: 3px; }
  .modulex-acilis-urun-nokta-balon { position: absolute; inset-block-start: -28px; display: grid; gap: 2px; inline-size: max-content; max-inline-size: 210px; padding: 10px 14px; border-radius: 12px; background-color: --text--; color: --bg--; box-shadow: 0 20px 40px -20px color-mix(in srgb, --text-- 80%, transparent); animation: modulex-acilis-urun-nokta-gir 0.35s ease both; }
  .modulex-acilis-urun-nokta-balon--sag { inset-inline-start: 28px; }

  .modulex-acilis-urun-nokta-ljyazi { display: grid; min-width: 0; }

  .modulex-acilis-urun-nokta-metin { color: --muted--; font-size: clamp(1.02rem, 1.3vw, 1.18rem); line-height: 1.7; max-width: 62ch; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-acilis-urun-nokta :is(.modulex-acilis-urun-nokta-baslik, .modulex-acilis-urun-nokta-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-acilis-urun-nokta-baslik { line-height: 1.35; }

  @media (prefers-reduced-motion: reduce) {
    .modulex-acilis-urun-nokta *, .modulex-acilis-urun-nokta *::before, .modulex-acilis-urun-nokta *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-acilis-urun-nokta";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const noktaAc = (s, P) => {
        const b = [...s.querySelectorAll("button[data-nokta]")];
        if (!b.length) return;
        s.classList.add(P + "--njs");
        const balon = (x) => document.getElementById(x.getAttribute("aria-controls") || "");
        const kapat = (x) => { x.setAttribute("aria-expanded", "false"); const p = balon(x); if (p) p.hidden = true; };
        b.forEach((x) => x.addEventListener("click", () => {
          const acik = x.getAttribute("aria-expanded") === "true";
          b.forEach(kapat);
          if (acik) return;
          x.setAttribute("aria-expanded", "true");
          const p = balon(x);
          if (p) p.hidden = false;
        }));
        s.addEventListener("keydown", (e) => {
          if (e.key !== "Escape") return;
          const a = b.find((x) => x.getAttribute("aria-expanded") === "true");
          b.forEach(kapat);
          if (a) a.focus();
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      noktaAc(s, P, az);
    });
  })();
</script>
